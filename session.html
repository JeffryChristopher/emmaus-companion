<title>Session · The Emmaus Companion</title>
<meta name="color-scheme" content="light dark">

<!-- The chosen language decides the typeface, so it is put on <html>
     before the first paint. -->
<script>
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('emmaus.prefs.v1')) || {};
    var tags = { en: 'en', ms: 'ms', zh: 'zh-Hans', ta: 'ta' };
    if (tags[prefs.lang]) {
      document.documentElement.setAttribute('lang', tags[prefs.lang]);
      document.documentElement.setAttribute('data-lang', prefs.lang);
    }
  } catch (e) { /* no storage: English, as the markup already says */ }
})();
</script>
